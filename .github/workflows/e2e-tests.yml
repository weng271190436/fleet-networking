name: E2E Tests

on:
  push:
    branches:
      - main
    tags: [ 'v*.*.*' ]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  GO_VERSION: '1.26.10'

jobs:
  detect-noop:
    runs-on: ubuntu-latest
    outputs:
      noop: ${{ steps.noop.outputs.should_skip }}
    steps:
      - name: Detect No-op Changes
        id: noop
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          do_not_skip: '["workflow_dispatch", "schedule", "push"]'
          concurrent_skipping: false

  e2e-tests:
    strategy:
      # disable fail-fast to continue the in-progress pipeline when one failed job is detected to
      # get test results for all scenarios.
      fail-fast: false
      matrix:
        include:
          - network-setting: shared-vnet
            enable-traffic-manager: true
            enable-afd: false
            enable-service-gateway: false
          - network-setting: peered-vnet
            enable-traffic-manager: false
            enable-afd: false
            enable-service-gateway: false
          - network-setting: dynamic-ip-allocation
            enable-traffic-manager: false
            enable-afd: false
            enable-service-gateway: false
          - network-setting: unsupported
            enable-traffic-manager: false
            enable-afd: false
            enable-service-gateway: false
          - network-setting: shared-vnet
            enable-traffic-manager: false
            enable-afd: true
            enable-service-gateway: false
          - network-setting: shared-vnet
            enable-traffic-manager: false
            enable-afd: false
            enable-service-gateway: true
    env:
      ENABLE_AZURE_FRONT_DOOR: ${{ matrix.enable-afd }}
      ENABLE_AFD_PRIVATE_LINK_AUTO_APPROVAL: ${{ matrix.enable-afd }}
      RETAIN_AFD_E2E_SETUP: "false"
      ENABLE_SERVICE_GATEWAY_PROOF: ${{ matrix.enable-service-gateway }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.enable-service-gateway && 'service-gateway-e2e' || '' }}
    needs: [
      detect-noop,
    ]
    if: needs.detect-noop.outputs.noop != 'true'
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare e2e variables
        run: |
          echo "AZURE_RESOURCE_GROUP=fleet-networking-e2e-$RANDOM" >> "$GITHUB_ENV"

      # Reference: https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-azure
      - name: 'OIDC Login to Azure Public Cloud'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.E2E_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
  
      # Note (chenyu1):
      #
      # After a recent update, GitHub Actions has set the GitHub ID token expiration time
      # to 5 minutes for security reasons; as most of our E2E steps cannot finish within
      # the time range, expiration errors will occur.
      #
      # As a temporary mitigation, we will add a step to fetch token periodically (every
      # 4 minutes) to be exact.
      #
      # This should no longer be necessary after the Azure CLI supports ID token refresh.
      - name: Fetch token every 4 minutes
        run: |
          while true; do
            # $ACTIONS_ID_TOKEN_REQUEST_TOKEN and $ACTIONS_ID_TOKEN_REQUEST_URL env vars are provided by
            # GitHub Actions automatically.
            REQUEST_TOKEN=$ACTIONS_ID_TOKEN_REQUEST_TOKEN
            REQUEST_URI=$ACTIONS_ID_TOKEN_REQUEST_URL
            FED_TOKEN=$(curl -H "Authorization: bearer $REQUEST_TOKEN" "${REQUEST_URI}&audience=api://AzureADTokenExchange" | jq .value -r)
            az login --service-principal -u ${{ secrets.E2E_AZURE_CLIENT_ID }} -t ${{ secrets.AZURE_TENANT_ID }} --federated-token "$FED_TOKEN" --output none
            sleep 240
          done &

      - name: Prepare Service Gateway CI tools and authorization
        if: matrix.enable-service-gateway
        run: |
          if ! kubelogin --version; then
            az aks install-cli
          fi
          kubelogin --version
          python3 --version
          {
            echo "SERVICE_GATEWAY_PRINCIPAL_TYPE=ServicePrincipal"
            echo "LOCATION=$LOCATION"
            echo "KUBERNETES_VERSION=$KUBERNETES_VERSION"
          } >> "$GITHUB_ENV"
        env:
          LOCATION: ${{ vars.SERVICE_GATEWAY_E2E_LOCATION || 'eastus2euap' }}
          KUBERNETES_VERSION: ${{ vars.SERVICE_GATEWAY_E2E_KUBERNETES_VERSION || '1.36.3' }}
  
      - name: Setup e2e Environment
        id: setup
        run: |
          make e2e-setup
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
          AZURE_NETWORK_SETTING: ${{ matrix.network-setting }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          ENABLE_TRAFFIC_MANAGER: ${{ matrix.enable-traffic-manager }}
      - name: Wait for role assignments to be effective
        run: sleep 5m
      - name: Run e2e tests
        id: proof
        run: |
          make e2e-tests
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
          AZURE_NETWORK_SETTING: ${{ matrix.network-setting }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          ENABLE_TRAFFIC_MANAGER: ${{ matrix.enable-traffic-manager }}
      - name: Collect agent logs
        if: always()
        run: |
          make e2e-collect-logs
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
          LOG_DIR: agent-logs-${{ matrix.network-setting }}-enable-atm-${{ matrix.enable-traffic-manager }}-enable-afd-${{ matrix.enable-afd }}-enable-sg-${{ matrix.enable-service-gateway }}
      - name: Collect Service Gateway report
        if: always() && matrix.enable-service-gateway
        run: |
          source test/scripts/e2e-config.sh
          mkdir -p "$LOG_DIR"
          for file in report.json setup-complete proof-network.json; do
            if [[ -f "$SERVICE_GATEWAY_STATE_DIR/$file" ]]; then
              cp "$SERVICE_GATEWAY_STATE_DIR/$file" "$LOG_DIR/"
            fi
          done
          printf 'subscription=%s\nresourceGroup=%s\nsetup=%s\nproof=%s\n' \
            "$AZURE_SUBSCRIPTION_ID" "$AZURE_RESOURCE_GROUP" \
            '${{ steps.setup.outcome }}' '${{ steps.proof.outcome }}' \
            > "$LOG_DIR/environment.txt"
          if [[ '${{ steps.proof.outcome }}' != success ]]; then
            echo "::warning::Service Gateway environment retained for inspected recovery: $AZURE_RESOURCE_GROUP"
          fi
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
          LOG_DIR: agent-logs-${{ matrix.network-setting }}-enable-atm-${{ matrix.enable-traffic-manager }}-enable-afd-${{ matrix.enable-afd }}-enable-sg-${{ matrix.enable-service-gateway }}
      - name: Upload agent logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-logs-${{ matrix.network-setting }}-enable-atm-${{ matrix.enable-traffic-manager }}-enable-afd-${{ matrix.enable-afd }}-enable-sg-${{ matrix.enable-service-gateway }}
          path: agent-logs-${{ matrix.network-setting }}-enable-atm-${{ matrix.enable-traffic-manager }}-enable-afd-${{ matrix.enable-afd }}-enable-sg-${{ matrix.enable-service-gateway }}
          if-no-files-found: warn
          retention-days: 3
      - name: Cleanup e2e
        if: always() && (!matrix.enable-service-gateway || (steps.setup.outcome == 'success' && steps.proof.outcome == 'success'))
        run: |
          make e2e-cleanup
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.E2E_AZURE_SUBSCRIPTION_ID }}
          AZURE_CLIENT_ID: ${{ secrets.E2E_AZURE_CLIENT_ID}}
          AZURE_CLIENT_SECRET: ${{ secrets.E2E_AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
          SERVICE_GATEWAY_CLEANUP_APPROVED: ${{ matrix.enable-service-gateway && 'true' || 'false' }}
