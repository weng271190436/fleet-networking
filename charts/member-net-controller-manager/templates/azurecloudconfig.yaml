{{- if or .Values.enableTrafficManagerFeature .Values.enableAFDPrivateLinkFeature }}
apiVersion: v1
kind: Secret
metadata:
  name: azure-cloud-config
  namespace: {{ .Values.fleetSystemNamespace }}
type: Opaque
data:
  azure.json: {{ .Values.azureCloudConfig | toJson | indent 4 | b64enc | quote }}
{{- end }}
